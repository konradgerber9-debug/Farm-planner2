<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#26301f;--mute:#6b735f;--line:#d9d6c8;--land:#e9efd9;--grid:#c9d3b2;--acc:#3f7d34;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a14;--card:#22271e;--ink:#e8ebe0;--mute:#9aa28c;--line:#3a4132;--land:#2a3322;--grid:#3a4630;--acc:#78c26b}}
:root[data-theme="dark"]{--bg:#171a14;--card:#22271e;--ink:#e8ebe0;--mute:#9aa28c;--line:#3a4132;--land:#2a3322;--grid:#3a4630;--acc:#78c26b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:16px;margin:0;flex:1 1 100%}
label{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:4px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:70px}
input.t{width:100%}
button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.d{color:#c0392b}
#stage{flex:1;min-height:0;padding:8px;display:flex;overflow:auto}
svg{flex:none;width:100%;height:100%;touch-action:none;background:var(--land);border:2px solid var(--line);border-radius:10px}
#panel{background:var(--card);border-top:1px solid var(--line);padding:8px 12px}
#sel{display:none;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
#sel.on{display:flex}
#pal{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
#pal button{white-space:nowrap;flex:0 0 auto}
details{margin-top:6px;font-size:13px}
summary{cursor:pointer;color:var(--mute)}
.row{display:flex;justify-content:space-between;padding:2px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px}
#panel{max-height:45vh;overflow:auto}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}.modal[hidden]{display:none}
.box{background:var(--card);border-radius:12px;padding:14px;width:min(520px,100%);display:flex;flex-direction:column;gap:8px}

.br{display:flex;gap:6px;flex-wrap:wrap}
.warn{color:#e74c3c}
header button,header select{padding:5px 8px;font-size:13px}
#pal button{touch-action:pan-x;cursor:grab;user-select:none;-webkit-user-select:none}
#tb{gap:6px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
header{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:6px 10px}
header>*{flex:none;white-space:nowrap}
h1{flex:none;font-size:15px;margin-right:4px}
#mn{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);align-items:center}#mn[hidden]{display:none}
button{min-height:36px}
#pal button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px;padding:6px 8px;border-top-width:4px}
#pal button b{font-size:24px;line-height:1.1;font-weight:400}#pal button span{font-size:11px}
#tb button{min-width:84px}
#tb button[data-bp]{min-width:42px}
#hud{display:flex;align-items:center;gap:10px;padding:6px 12px;background:linear-gradient(#4a3320,#33220f);color:#ffe9b0;font-weight:700;font-size:14px;box-shadow:0 2px 6px #0004;white-space:nowrap}
#hl{flex:1;min-width:70px;display:flex;align-items:center;gap:6px}#hb{flex:1;height:10px;background:#0007;border-radius:6px;overflow:hidden}#hf{display:block;height:100%;width:0;background:linear-gradient(#ffe27a,#f0a400);transition:width .4s}
#hh{background:linear-gradient(#6fcf5a,#3f9a33);color:#fff;border:0;font-weight:700;box-shadow:0 2px 0 #2a6e22;border-radius:10px}

#ts{position:fixed;top:70px;left:50%;transform:translate(-50%,-10px);background:#2b2118;color:#ffe9b0;padding:9px 16px;border-radius:22px;z-index:40;box-shadow:0 6px 18px #0006;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center;font-weight:600}
#pal button{transition:transform .15s,opacity .2s}
#pal button.on{background:var(--acc);color:#fff;transform:translateY(-4px) scale(1.06);box-shadow:0 4px 10px #0004}
svg{background:repeating-linear-gradient(90deg,#0000 0 28px,#0000000c 28px 56px),var(--land)}
@media print{header,#panel{display:none}#stage{overflow:visible}}

<body>
<header>
<h1>🌾 Farm Layout Planner</h1>
<label>Width (m)<input id="fw" type="number" min="20" max="2000" value="200"></label>
<label>Length (m)<input id="fh" type="number" min="20" max="2000" value="120"></label>
<select id="sg"><option value="1">Snap 1 m</option><option value="5">Snap 5 m</option><option value="10">Snap 10 m</option></select><button id="zo">−</button><button id="zi">+</button><button id="un">↶</button><button id="re">↷</button><button id="tm">⛰ Terrain</button><button id="pl">📁 Plans</button><button id="im">🖼 Image</button><button id="ex" class="p">Export</button><button id="pr">Print</button><button id="clr" class="d">Clear</button>
</header>
<div id="stage"><svg id="s"></svg></div>
<div id="panel">
<div id="sel">
<label style="flex:1 1 120px">Label<input id="l" class="t"></label>
<label>W<input id="w" type="number" min="1"></label>
<label>H<input id="h" type="number" min="1"></label>
<label>Use / crop<select id="c"></select></label><label style="flex:1 1 140px">Notes<input id="n" class="t"></label><button id="rot">⟳ Rotate</button><button id="lk">🔓</button><button id="dup">Duplicate</button>
<button id="del" class="d">Delete</button>
</div>
<div id="tb" style="display:none"><button data-tl="up" class="p">⬆ Raise</button><button data-tl="down">⬇ Lower</button><button data-tl="flat">◻ Flatten</button><label>Δ m<input id="tv" type="number" value="1" min=".1" step=".5"></label><label>Brush<select id="tr"><option value="0">1 cell</option><option value="1">3×3</option><option value="2">5×5</option></select></label><button id="tc" class="d">Reset</button><span id="te" style="font-size:12px;color:var(--mute)"></span></div><div id="pal"></div>
<details><summary id="sum">Summary</summary><div id="stats"></div></details>
<div id="mp" class="modal" hidden><div class="box"><b>My farm plans</b><div id="pls"></div><input id="pn" class="t" placeholder="Plan name"><div class="br"><button id="pa" class="p">New blank plan</button><button id="pd">Duplicate current</button><button id="pm">Rename current</button><button id="px">Close</button></div></div></div>
<div id="mi" class="modal" hidden><div class="box"><b>Plan image</b><img id="pi" alt="Farm plan" style="width:100%;border-radius:8px"><small>On a phone: long-press the image to save it.</small><div class="br"><button id="ik" class="p">Download PNG</button><button id="ic">Close</button></div></div></div>
<div id="m" class="modal" hidden><div class="box"><b>Export / Import plan</b><textarea id="mt" rows="8"></textarea><div class="br"><button id="mc" class="p">Copy</button><button id="md">Download file</button><button id="ml">Load pasted plan</button><button id="mx">Close</button></div></div></div>
</div>
<script>
var T={field:['🌽','Crop field','#d4a91f',30,20],orchard:['🍎','Orchard','#5aa34a',20,20],pasture:['🐄','Pasture','#97c96b',40,30],garden:['🥕','Veg garden','#e4788c',12,10],greenhouse:['🌱','Greenhouse','#4fb3bf',12,6],barn:['🏚️','Barn','#b5533c',14,10],house:['🏠','House','#8a6fb0',10,8],coop:['🐔','Coop','#d98c3f',6,4],pond:['💧','Pond','#4a90d9',14,10],forest:['🌲','Woodland','#2f6b3a',20,20],road:['🛣️','Path/Road','#9a9a8a',40,3],fence:['🚧','Fence line','#7a5c3a',40,1],irrig:['🚿','Irrigation','#2e86c1',50,1],paddock:['🐑','Paddock','#b4d98a',30,20],well:['⛲','Well','#3b6ea8',3,3],silo:['🏭','Silo / Shed','#8c8c8c',8,8],solar:['☀️','Solar array','#2c3e6b',20,10],hives:['🐝','Beehives','#f1c40f',5,3],compost:['♻️','Compost','#6b4f2a',5,5],parking:['🚜','Machinery yard','#a39b88',15,10]};
var KEY='farm-plan-v1',st={fw:200,fh:120,items:[],sel:null},svg=document.getElementById('s'),drag=null,uid=1;
function $(i){return document.getElementById(i)}
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv&&sv.items){st=sv;st.sel=null;uid=st.items.reduce(function(m,i){return Math.max(m,i.id)},0)+1}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function get(id){return st.items.filter(function(i){return i.id===id})[0]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
 var ov=overlaps(),W=st.fw,H=st.fh,g='',step=W>400||H>400?50:10,u=Math.max(W,H)/100;
 for(var x=step;x<W;x+=step)g+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'" stroke="var(--grid)" stroke-width="'+u*.15+'"/>';
 for(var y=step;y<H;y+=step)g+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="var(--grid)" stroke-width="'+u*.15+'"/>';
 var o='';
 st.items.forEach(function(it){
  var t=T[it.t],s=it.id===st.sel,fs=Math.max(Math.min(it.w/Math.max(it.l.length,3)*1.1,it.h*.4,u*5),u*1.6);
  var shape=it.t==='pond'?'<ellipse cx="'+(it.x+it.w/2)+'" cy="'+(it.y+it.h/2)+'" rx="'+it.w/2+'" ry="'+it.h/2+'"':'<rect x="'+it.x+'" y="'+it.y+'" width="'+it.w+'" height="'+it.h+'" rx="'+u*.4+'"';
  o+='<g data-id="'+it.id+'" style="cursor:move">'+shape+' fill="'+t[2]+'" fill-opacity=".8" stroke="'+(ov[it.id]?'#e74c3c':s?'var(--ink)':t[2])+'" stroke-width="'+(s?u*.35:u*.15)+'" '+(s?'stroke-dasharray="'+u+'"':'')+'/><text x="'+(it.x+it.w/2)+'" y="'+(it.y+it.h/2)+'" font-size="'+fs+'" text-anchor="middle" dominant-baseline="central" fill="#111" style="pointer-events:none">'+t[0]+' '+esc(it.l)+(s?' · '+Math.round(it.w)+'×'+Math.round(it.h)+'m':'')+'</text>';
  if(s)o+='<circle data-h="'+it.id+'" cx="'+(it.x+it.w)+'" cy="'+(it.y+it.h)+'" r="'+u*1.8+'" fill="var(--acc)" stroke="#fff" stroke-width="'+u*.3+'" style="cursor:nwse-resize"/>';
  o+='</g>';
 });
 svg.setAttribute('viewBox','-1 -1 '+(W+2)+' '+(H+2));
 svg.innerHTML=terr()+g+o+furn(u,W,H);
 stats();
}
function stats(){
 var tot=st.fw*st.fh,by={},used=0;
 st.items.forEach(function(i){var a=i.t==='pond'?Math.PI*i.w*i.h/4:i.w*i.h;by[i.t]=(by[i.t]||0)+a;if(i.t!=='road')used+=a});
 $('sum').textContent='Farm: '+(tot/10000).toFixed(2)+' ha · '+Math.round(used/tot*100)+'% planned';
 var h='';Object.keys(by).forEach(function(k){h+='<div class="row"><span><span class="dot" style="background:'+T[k][2]+'"></span>'+T[k][1]+'</span><span>'+Math.round(by[k]).toLocaleString()+' m² ('+(by[k]/10000).toFixed(2)+' ha)</span></div>'});
 $('stats').innerHTML=h||'<div class="row">Nothing placed yet.</div>';
}
function sync(){
 var it=get(st.sel);$('sel').classList.toggle('on',!!it);
 if(it){$('l').value=it.l;$('w').value=Math.round(it.w);$('h').value=Math.round(it.h)}
}
function pt(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function sn(v){return Math.round(v/SN)*SN}
svg.addEventListener('pointerdown',function(e){
 var h=e.target.closest('[data-h]'),g=e.target.closest('[data-id]'),p=pt(e);
 if(h){var it=get(+h.dataset.h);drag={m:it.lk?'x':'r',it:it}}
 else if(g){var it=get(+g.dataset.id);st.sel=it.id;drag={m:it.lk?'x':'m',it:it,dx:p.x-it.x,dy:p.y-it.y};
  st.items.splice(st.items.indexOf(it),1);st.items.push(it)}
 else{st.sel=null;drag={m:'p',x:e.clientX,y:e.clientY,l:$('stage').scrollLeft,t:$('stage').scrollTop};svg.setPointerCapture(e.pointerId);sync();render();return}
 svg.setPointerCapture(e.pointerId);sync();render();
});
svg.addEventListener('pointermove',function(e){
 if(!drag||drag.m==='x')return;if(drag.m==='p'){$('stage').scrollLeft=drag.l-(e.clientX-drag.x);$('stage').scrollTop=drag.t-(e.clientY-drag.y);return}var p=pt(e),it=drag.it;
 if(drag.m==='m'){it.x=Math.max(0,Math.min(st.fw-it.w,sn(p.x-drag.dx)));it.y=Math.max(0,Math.min(st.fh-it.h,sn(p.y-drag.dy)))}
 else{it.w=Math.max(1,Math.min(st.fw-it.x,sn(p.x-it.x)));it.h=Math.max(1,Math.min(st.fh-it.y,sn(p.y-it.y)))}
 sync();render();
});
function end(){if(drag){drag=null;save()}}
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
function add(k,src){
 var t=T[k],s=Math.max(st.fw,st.fh)/200,w=Math.min(st.fw,Math.max(1,Math.round(t[3]*Math.max(1,s)))),h=Math.min(st.fh,Math.max(1,Math.round(t[4]*Math.max(1,s))));
 var it=src?{id:uid++,t:src.t,l:src.l,w:src.w,h:src.h,x:Math.min(st.fw-src.w,src.x+3),y:Math.min(st.fh-src.h,src.y+3)}:{id:uid++,t:k,l:t[1],w:w,h:h,x:sn((st.fw-w)/2),y:sn((st.fh-h)/2)};
 st.items.push(it);st.sel=it.id;sync();render();save();
}
var pal=$('pal');Object.keys(T).forEach(function(k){var b=document.createElement('button');b.textContent=T[k][0]+' '+T[k][1];b.onclick=function(){add(k)};pal.appendChild(b)});
$('l').oninput=function(){var it=get(st.sel);if(it){it.l=this.value;render();save()}};
$('w').oninput=function(){var it=get(st.sel),v=+this.value;if(it&&v>0){it.w=Math.min(v,st.fw);it.x=Math.min(it.x,st.fw-it.w);render();save()}};
$('h').oninput=function(){var it=get(st.sel),v=+this.value;if(it&&v>0){it.h=Math.min(v,st.fh);it.y=Math.min(it.y,st.fh-it.h);render();save()}};
$('del').onclick=function(){st.items=st.items.filter(function(i){return i.id!==st.sel});st.sel=null;sync();render();save()};
$('dup').onclick=function(){var it=get(st.sel);if(it)add(it.t,it)};
$('clr').onclick=function(){if(st.items.length&&!confirm('Remove everything from the plan?'))return;st.items=[];st.sel=null;sync();render();save()};
function size(){var w=Math.max(20,Math.min(2000,+$('fw').value||200)),h=Math.max(20,Math.min(2000,+$('fh').value||120));st.fw=w;st.fh=h;
 st.items.forEach(function(i){i.w=Math.min(i.w,w);i.h=Math.min(i.h,h);i.x=Math.min(i.x,w-i.w);i.y=Math.min(i.y,h-i.h)});sync();render();save()}
$('fw').onchange=size;$('fh').onchange=size;
var SN=1,Z=1,hs=[],rs=[],LN={road:1,fence:1,irrig:1};
var CR={field:{'Wheat':3.5,'Corn':10,'Soybeans':3,'Potatoes':30,'Barley':4,'Fallow':0},garden:{'Mixed veg':20,'Tomatoes':50,'Herbs':5},orchard:{'Apples':25,'Pears':20,'Cherries':8,'Citrus':30},pasture:{'Cattle':2,'Sheep':10,'Goats':12,'Horses':1,'Resting':0}};CR.paddock=CR.pasture;
var CO={field:.6,orchard:7,pasture:.4,paddock:.4,garden:4,greenhouse:70,barn:300,house:1500,coop:90,pond:18,forest:1,road:15,silo:200,solar:120,hives:20,compost:2,parking:10};
function push(){var s=JSON.stringify(st.items);if(hs[hs.length-1]===s)return;hs.push(s);if(hs.length>60)hs.shift();rs=[]}
function undo(){if(!hs.length)return;rs.push(JSON.stringify(st.items));st.items=JSON.parse(hs.pop());st.sel=null;sync();render();save()}
function redoo(){if(!rs.length)return;hs.push(JSON.stringify(st.items));st.items=JSON.parse(rs.pop());st.sel=null;sync();render();save()}
function overlaps(){var o={};st.items.forEach(function(a){st.items.forEach(function(b){if(a.id<b.id&&!LN[a.t]&&!LN[b.t]&&a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h)o[a.id]=o[b.id]=1})});return o}
function furn(u,W,H){var b=W>400||H>400?100:W>100?50:10,x=W-b-u*2,y=H-u*2;return '<g stroke="var(--ink)" fill="var(--ink)" style="pointer-events:none"><path d="M'+x+' '+y+'h'+b+'" stroke-width="'+u*.4+'"/><text x="'+x+'" y="'+(y-u*.8)+'" font-size="'+u*2+'" stroke="none">'+b+' m</text><path d="M'+u*3+' '+u*7+'v-'+u*4+'l-'+u+' '+u*1.5+'m'+u+' -'+u*1.5+'l'+u+' '+u*1.5+'" stroke-width="'+u*.3+'" fill="none"/><text x="'+u*3+'" y="'+u*9.5+'" font-size="'+u*2+'" text-anchor="middle" stroke="none">N</text></g>'}
function stats(){var tot=st.fw*st.fh,by={},used=0,cost=0,y=[],ov=Object.keys(overlaps()).length;
 st.items.forEach(function(i){var a=i.t==='pond'?Math.PI*i.w*i.h/4:i.w*i.h,ha=a/1e4,r=CR[i.t]&&CR[i.t][i.c];by[i.t]=(by[i.t]||0)+a;if(!LN[i.t])used+=a;cost+=a*(CO[i.t]||0);
  if(i.t==='fence')cost+=Math.max(i.w,i.h)*15;if(i.t==='irrig')cost+=Math.max(i.w,i.h)*8;
  if(r)y.push('<div class="row"><span>'+esc(i.l)+' ('+i.c+')</span><span>'+(i.t==='pasture'||i.t==='paddock'?Math.floor(ha*r)+' head':(ha*r).toFixed(1)+' t/yr')+'</span></div>')});
 $('sum').textContent='Farm: '+(tot/1e4).toFixed(2)+' ha · '+Math.round(used/tot*100)+'% planned'+(ov?' · ⚠ '+ov+' overlapping':'');
 var h='';Object.keys(by).forEach(function(k){h+='<div class="row"><span><span class="dot" style="background:'+T[k][2]+'"></span>'+T[k][1]+'</span><span>'+Math.round(by[k]).toLocaleString()+' m² ('+(by[k]/1e4).toFixed(2)+' ha)</span></div>'});
 if(y.length)h+='<b>Estimated output</b>'+y.join('');
 if(ov)h+='<div class="row warn">⚠ '+ov+' items overlap (red outlines)</div>';
 if(cost)h+='<div class="row"><b>Rough setup cost</b><b>~$'+Math.round(cost).toLocaleString()+'</b></div>';
 $('stats').innerHTML=h||'<div class="row">Nothing placed yet.</div>'}
